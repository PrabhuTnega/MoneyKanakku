<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Set Budget — MoneyKanakku</title>
<meta name="theme-color" content="#6c5ce7">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="tap-highlight-none bg-app">

<header class="mobile-topbar d-lg-none">
  <button class="icon-btn ripple-surface" onclick="MET.goBack('budget.html')"><i class="bi bi-x-lg"></i></button>
  <div class="topbar-title">Set Budget</div>
  <span></span>
</header>

<div class="container-app d-none d-lg-flex align-items-center gap-3 py-4">
  <button class="icon-btn ripple-surface" onclick="MET.goBack('budget.html')"><i class="bi bi-x-lg"></i></button>
  <h1 class="page-heading mb-0">Set Budget</h1>
</div>

<main style="max-width:560px;margin:0 auto;" class="container-app pb-5 page-enter">

  <form id="budgetForm" novalidate>

    <div class="segmented mb-4" id="scopeToggle">
      <button type="button" class="active" data-target="overallFields">Overall Budget</button>
      <button type="button" data-target="categoryFields">Category Budget</button>
    </div>

    <div class="surface-card text-center py-4 mb-4">
      <div class="text-secondary fw-600 mb-2" style="font-size:.8rem;">BUDGET AMOUNT</div>
      <div class="d-flex align-items-center justify-content-center gap-2">
        <span class="font-display fw-700" style="font-size:2rem;color:var(--text-muted);">₹</span>
        <input type="number" name="amount" id="amountInput" class="amount-input" placeholder="0" style="max-width:220px;" min="0.01" step="0.01" required>
      </div>
      <div class="invalid-feedback text-center"></div>
    </div>

    <div id="categoryFields" class="d-none mb-3">
      <label class="form-label">Category</label>
      <select class="form-select" id="categorySelect"></select>
    </div>

    <div class="mb-3">
      <label class="form-label">Month / Year</label>
      <div class="input-icon-group">
        <i class="bi bi-calendar3"></i>
        <input type="month" id="monthInput" class="form-control" required>
      </div>
    </div>

    <div class="surface-card mb-4">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <div class="fw-700" style="font-size:.88rem;">Repeat every month</div>
          <div class="text-secondary" style="font-size:.74rem;">Automatically carry this budget forward</div>
        </div>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="repeatToggle" checked style="cursor:pointer;">
        </div>
      </div>
    </div>

    <div class="surface-card mb-4">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <div class="fw-700" style="font-size:.88rem;">Alert me at 80%</div>
          <div class="text-secondary" style="font-size:.74rem;">Get a visual warning near the limit</div>
        </div>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="alertToggle" checked style="cursor:pointer;">
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-100 ripple-surface mb-2" id="saveBtn">Save Budget</button>
    <button type="button" class="btn btn-outline-soft btn-lg w-100 ripple-surface" onclick="MET.goBack('budget.html')">Cancel</button>
  </form>
</main>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/validate.js"></script>
<script src="assets/js/budget-form-data.js"></script>
<script>
  MET.guardAuth('protected');
</script>
</body>
</html>
