<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Change Password — MoneyKanakku</title>
<meta name="theme-color" content="#6c5ce7">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="tap-highlight-none bg-app">

<header class="mobile-topbar d-lg-none">
  <button class="icon-btn ripple-surface" onclick="MET.goBack('settings.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="topbar-title">Change Password</div>
  <span></span>
</header>

<div class="container-app d-none d-lg-flex align-items-center gap-3 py-4">
  <button class="icon-btn ripple-surface" onclick="MET.goBack('settings.html')"><i class="bi bi-arrow-left"></i></button>
  <h1 class="page-heading mb-0">Change Password</h1>
</div>

<main style="max-width:520px;margin:0 auto;" class="container-app pb-5 page-enter">

  <div class="icon-chip-lg chip-violet mb-4"><i class="bi bi-shield-lock"></i></div>
  <p class="text-secondary mb-4">Choose a strong password you haven't used before to keep your account secure.</p>

  <form id="changePwForm" novalidate>
    <div class="mb-3">
      <label class="form-label">Current password</label>
      <div class="input-icon-group position-relative">
        <i class="bi bi-lock"></i>
        <input type="password" id="cp1" name="currentPassword" class="form-control" style="padding-right:44px;" placeholder="••••••••" required>
        <button type="button" class="btn p-0 position-absolute" style="right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);" data-toggle-password="cp1"><i class="bi bi-eye"></i></button>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">New password</label>
      <div class="input-icon-group position-relative">
        <i class="bi bi-lock"></i>
        <input type="password" id="cp2" name="newPassword" class="form-control" style="padding-right:44px;" placeholder="••••••••" minlength="8" required>
        <button type="button" class="btn p-0 position-absolute" style="right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);" data-toggle-password="cp2"><i class="bi bi-eye"></i></button>
      </div>
      <div class="d-flex gap-1 mt-2" id="pwStrengthBars">
        <span class="flex-fill" style="height:4px;border-radius:99px;background:var(--border-color);"></span>
        <span class="flex-fill" style="height:4px;border-radius:99px;background:var(--border-color);"></span>
        <span class="flex-fill" style="height:4px;border-radius:99px;background:var(--border-color);"></span>
        <span class="flex-fill" style="height:4px;border-radius:99px;background:var(--border-color);"></span>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">Confirm new password</label>
      <div class="input-icon-group position-relative">
        <i class="bi bi-lock"></i>
        <input type="password" id="cp3" data-match="#cp2" data-match-message="Passwords don't match." class="form-control" style="padding-right:44px;" placeholder="••••••••" minlength="8" required>
        <button type="button" class="btn p-0 position-absolute" style="right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);" data-toggle-password="cp3"><i class="bi bi-eye"></i></button>
      </div>
    </div>

    <div class="surface-card mb-4" style="font-size:.8rem;">
      <div class="d-flex align-items-center gap-2 py-1"><i class="bi bi-check-circle-fill" style="color:var(--accent-teal-dark);"></i> At least 8 characters</div>
      <div class="d-flex align-items-center gap-2 py-1"><i class="bi bi-check-circle-fill" style="color:var(--accent-teal-dark);"></i> One uppercase letter</div>
      <div class="d-flex align-items-center gap-2 py-1"><i class="bi bi-check-circle-fill" style="color:var(--accent-teal-dark);"></i> One number or symbol</div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-100 ripple-surface" id="changePwBtn">Update Password</button>
  </form>
</main>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/validate.js"></script>
<script>
  MET.guardAuth('protected');

  function passwordScore(pw){
    let score = 0;
    if(pw.length >= 8) score++;
    if(/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if(/\d/.test(pw)) score++;
    if(/[^A-Za-z0-9]/.test(pw)) score++;
    return score;
  }
  $('#cp2').on('input', function(){
    const score = passwordScore(this.value);
    const colors = ['var(--border-color)', 'var(--accent-coral)', 'var(--accent-amber)', 'var(--accent-teal)', 'var(--accent-teal-dark)'];
    $('#pwStrengthBars span').each(function(i){
      $(this).css('background', i < score ? colors[score] : 'var(--border-color)');
    });
  });

  $('#changePwForm').on('submit', function(e){
    e.preventDefault();
    const $form = $(this);
    if(!MET.validateForm($form)) return;

    const $btn = $('#changePwBtn');
    MET.showButtonLoading($btn, 'Updating…');
    MET.api.post('/auth/change-password', {
      currentPassword: $form.find('[name=currentPassword]').val(),
      newPassword: $form.find('[name=newPassword]').val()
    }).then(function(){
      MET.toastSuccess('Password changed successfully.');
      setTimeout(function(){ window.location.href = 'settings.html'; }, 900);
    }, function(err){
      MET.hideButtonLoading($btn);
      if(err.fieldErrors){ MET.applyServerFieldErrors($form, err.fieldErrors); }
      else { MET.showFormError($form, err.message); }
      if(err.status !== 422) MET.toastError(err.message);
    });
  });
</script>
</body>
</html>
