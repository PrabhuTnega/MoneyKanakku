<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Forgot Password — MoneyKanakku</title>
<meta name="theme-color" content="#6c5ce7">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="tap-highlight-none bg-app">

<div class="mobile-topbar d-lg-none">
  <button class="icon-btn ripple-surface" onclick="MET.goBack('login.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="topbar-title">Forgot Password</div>
</div>

<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="w-100 page-enter" style="max-width:420px; padding: 10px 26px 28px;">

    <div class="d-none d-lg-flex align-items-center gap-2 mb-4">
      <button class="icon-btn ripple-surface" onclick="MET.goBack('login.html')"><i class="bi bi-arrow-left"></i></button>
    </div>

    <div id="formState">
      <div class="icon-chip-lg chip-violet mb-4"><i class="bi bi-key"></i></div>
      <h2 class="font-display fw-800 mb-1">Forgot password?</h2>
      <p class="text-secondary mb-4">No worries, enter your email and we'll send you a link to reset it.</p>

      <form id="forgotForm" novalidate>
        <div class="mb-4">
          <label class="form-label">Email address</label>
          <div class="input-icon-group">
            <i class="bi bi-envelope"></i>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 ripple-surface" id="forgotBtn">Send Reset Link</button>
      </form>
    </div>

    <div id="sentState" class="d-none text-center">
      <div class="icon-chip-lg chip-teal mb-4 mx-auto"><i class="bi bi-envelope-check"></i></div>
      <h2 class="font-display fw-800 mb-1">Check your email</h2>
      <p class="text-secondary mb-1">If an account exists for</p>
      <p class="fw-700 mb-3" id="sentToEmail" style="color:var(--text-primary);"></p>
      <p class="text-secondary mb-4" style="font-size:.86rem;">we've sent a link to reset your password. It expires in 10 minutes — open it on this device to continue.</p>
      <button type="button" class="btn btn-outline-soft btn-lg w-100 ripple-surface" id="tryAnotherBtn">Try a different email</button>
    </div>

    <p class="text-center text-secondary mt-4 mb-0" style="font-size:.86rem;">
      Remember your password? <a href="login.html" class="fw-700" style="color:var(--brand-500);">Sign in</a>
    </p>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/validate.js"></script>
<script>
  MET.guardAuth('public');

  $('#forgotForm').on('submit', function(e){
    e.preventDefault();
    const $form = $(this);
    if(!MET.validateForm($form)) return;
    const email = $form.find('[name=email]').val().trim();

    const $btn = $('#forgotBtn');
    MET.showButtonLoading($btn, 'Sending…');
    MET.api.post('/auth/forgot-password', { email: email }).then(function(resp){
      MET.hideButtonLoading($btn);
      $('#sentToEmail').text(email);
      $('#formState').addClass('d-none');
      $('#sentState').removeClass('d-none');
      // Real SMTP is wired up (see api/src/lib/mail.ts) — devResetLink is
      // only ever present outside production, as a fallback so this flow
      // stays testable even without checking a real inbox.
      if(resp.devResetLink){ console.log('[dev only] password reset link:', resp.devResetLink); }
    }, function(err){
      MET.hideButtonLoading($btn);
      if(err.fieldErrors){ MET.applyServerFieldErrors($form, err.fieldErrors); }
      else { MET.showFormError($form, err.message); }
      if(err.status !== 422) MET.toastError(err.message);
    });
  });

  $('#tryAnotherBtn').on('click', function(){
    $('#sentState').addClass('d-none');
    $('#formState').removeClass('d-none');
    $('#forgotForm')[0].reset();
  });
</script>
</body>
</html>
