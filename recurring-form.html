<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>New Recurring — MoneyKanakku</title>
<meta name="theme-color" content="#6c5ce7">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="tap-highlight-none bg-app">

<header class="mobile-topbar d-lg-none">
  <button class="icon-btn ripple-surface" onclick="MET.goBack('recurring.html')"><i class="bi bi-x-lg"></i></button>
  <div class="topbar-title" id="formTitleMobile">New Recurring Expense</div>
  <span></span>
</header>

<div class="container-app d-none d-lg-flex align-items-center gap-3 py-4">
  <button class="icon-btn ripple-surface" onclick="MET.goBack('recurring.html')"><i class="bi bi-x-lg"></i></button>
  <h1 class="page-heading mb-0" id="formTitleDesktop">New Recurring Expense</h1>
</div>

<main style="max-width:600px;margin:0 auto;" class="container-app pb-5 page-enter">

  <form id="recurForm" novalidate>

    <!-- Expense / Income toggle -->
    <div class="segmented mb-4" id="typeToggle">
      <button type="button" class="active" data-type="expense"><i class="bi bi-arrow-down-circle-fill me-1"></i>Expense</button>
      <button type="button" data-type="income"><i class="bi bi-arrow-up-circle-fill me-1"></i>Income</button>
    </div>

    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" id="titleInput" placeholder="e.g. Rent, Netflix, Home Loan EMI" maxlength="120" required>
    </div>

    <div class="surface-card text-center py-4 mb-4" id="amountCard" style="border:2px solid var(--accent-coral);">
      <div class="text-secondary fw-600 mb-2" style="font-size:.8rem;" id="amountLabel">AMOUNT</div>
      <div class="d-flex align-items-center justify-content-center gap-2">
        <span class="font-display fw-700" id="currencySymbol" style="font-size:2rem;color:var(--accent-coral);">₹</span>
        <input type="number" class="amount-input" id="amountInput" placeholder="0" style="max-width:220px;color:var(--accent-coral);" min="0.01" step="0.01" required>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-12 col-md-6">
        <label class="form-label">Category</label>
        <select class="form-select" id="categorySelect"></select>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" id="methodLabel">Payment method</label>
        <select class="form-select" id="methodSelect">
          <option value="UPI">UPI (Autopay)</option>
          <option value="CARD">Card</option>
          <option value="NETBANKING">Netbanking</option>
          <option value="CASH">Cash</option>
          <option value="WALLET">Wallet</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
    </div>

    <label class="form-label px-1">Repeat frequency</label>
    <div class="segmented mb-3" id="freqToggle">
      <button type="button" class="active" data-freq="MONTHLY">Monthly</button>
      <button type="button" data-freq="WEEKLY">Weekly</button>
      <button type="button" data-freq="YEARLY">Yearly</button>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-12 col-md-6">
        <label class="form-label">Start date</label>
        <div class="input-icon-group"><i class="bi bi-calendar3"></i><input type="date" class="form-control" id="startDateInput" required></div>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">End date <span class="text-muted-c fw-400">(optional)</span></label>
        <div class="input-icon-group"><i class="bi bi-calendar-x"></i><input type="date" class="form-control" id="endDateInput"></div>
      </div>
    </div>

    <div class="surface-card mb-4">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <div class="fw-700" style="font-size:.88rem;" id="autoGenLabel">Auto-generate expense</div>
          <div class="text-secondary" style="font-size:.74rem;">Create a transaction automatically on due date</div>
        </div>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="autoGenToggle" checked style="cursor:pointer;">
        </div>
      </div>
    </div>

    <div class="surface-card mb-4">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <div class="fw-700" style="font-size:.88rem;">Remind me 1 day before</div>
          <div class="text-secondary" style="font-size:.74rem;">Get a notification before it's due</div>
        </div>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="remindToggle" checked style="cursor:pointer;">
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-lg w-100 ripple-surface mb-2" id="saveBtn" style="background:var(--accent-coral);border:0;color:#fff;">Save Recurring Expense</button>
    <button type="button" class="btn btn-outline-soft btn-lg w-100 ripple-surface mb-2" onclick="MET.goBack('recurring.html')">Cancel</button>
    <button type="button" class="btn btn-danger-soft btn-lg w-100 ripple-surface d-none" id="deleteBtn">Delete Recurring Rule</button>
  </form>
</main>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/validate.js"></script>
<script src="assets/js/recurring-form-data.js"></script>
<script>
  MET.guardAuth('protected');
</script>
</body>
</html>
