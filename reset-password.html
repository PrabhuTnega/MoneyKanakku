<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Reset Password — MoneyKanakku</title>
<meta name="theme-color" content="#6c5ce7">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="tap-highlight-none bg-app">

<div class="mobile-topbar d-lg-none">
  <button class="icon-btn ripple-surface" onclick="MET.goBack('login.html')"><i class="bi bi-arrow-left"></i></button>
  <div class="topbar-title">Reset Password</div>
</div>

<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="w-100 page-enter" style="max-width:420px; padding: 10px 26px 28px;">

    <div id="resetFormState">
      <div class="icon-chip-lg chip-violet mb-4"><i class="bi bi-shield-lock"></i></div>
      <h2 class="font-display fw-800 mb-1">Set new password</h2>
      <p class="text-secondary mb-4">Your new password must be different from previous ones.</p>

      <form id="resetForm" novalidate>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <div class="input-icon-group position-relative">
            <i class="bi bi-lock"></i>
            <input type="password" id="npw1" name="newPassword" class="form-control" style="padding-right:44px;" placeholder="••••••••" minlength="8" required>
            <button type="button" class="btn p-0 position-absolute" style="right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);" data-toggle-password="npw1"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm password</label>
          <div class="input-icon-group position-relative">
            <i class="bi bi-lock"></i>
            <input type="password" id="npw2" data-match="#npw1" data-match-message="Passwords don't match." class="form-control" style="padding-right:44px;" placeholder="••••••••" minlength="8" required>
            <button type="button" class="btn p-0 position-absolute" style="right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);" data-toggle-password="npw2"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 ripple-surface" id="resetBtn">Update Password</button>
      </form>
    </div>

    <div id="resetInvalidState" class="d-none text-center">
      <div class="icon-chip-lg chip-coral mb-4 mx-auto"><i class="bi bi-exclamation-triangle-fill"></i></div>
      <h2 class="font-display fw-800 mb-1">This link isn't valid</h2>
      <p class="text-secondary mb-4">It may have already been used, or it's expired (reset links last 10 minutes). Request a new one to continue.</p>
      <a href="forgot-password.html" class="btn btn-primary btn-lg w-100 ripple-surface">Request a New Link</a>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/validate.js"></script>
<script>
  MET.guardAuth('public');
  const resetToken = new URLSearchParams(window.location.search).get('token') || '';

  // No token at all means this page was opened directly, not from a real
  // emailed link — nothing to submit, so show the "request a new one"
  // state right away instead of a form that can only ever fail.
  if(!resetToken){
    document.getElementById('resetFormState').classList.add('d-none');
    document.getElementById('resetInvalidState').classList.remove('d-none');
  }

  $('#resetForm').on('submit', function(e){
    e.preventDefault();
    const $form = $(this);
    if(!MET.validateForm($form)) return;

    const $btn = $('#resetBtn');
    MET.showButtonLoading($btn, 'Updating…');
    MET.api.post('/auth/reset-password', {
      token: resetToken,
      newPassword: $form.find('[name=newPassword]').val()
    }).then(function(){
      MET.toastSuccess('Password updated — sign in with your new password.');
      setTimeout(function(){ window.location.href = 'login.html'; }, 900);
    }, function(err){
      MET.hideButtonLoading($btn);
      // An invalid/expired token specifically gets the dedicated state
      // (with a way straight back into the flow), not just an inline error.
      if(err.status === 422 && !err.fieldErrors){
        document.getElementById('resetFormState').classList.add('d-none');
        document.getElementById('resetInvalidState').classList.remove('d-none');
        return;
      }
      if(err.fieldErrors){ MET.applyServerFieldErrors($form, err.fieldErrors); }
      else { MET.showFormError($form, err.message); }
      if(err.status !== 422) MET.toastError(err.message);
    });
  });
</script>
</body>
</html>
